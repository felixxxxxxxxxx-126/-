<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>桌面小狗</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main aria-label="你的小狗">
    <output id="bubble" aria-live="polite">我来陪你啦！</output>
    <button id="dog" aria-label="抚摸小狗，按住可拖动"><span class="sprite" role="img" aria-label="白色长毛、黑鼻头的小狗完整姿态动画"></span></button>
    <div id="effect" aria-hidden="true"></div>
    <nav aria-label="互动"><button data-action="pet">摸摸</button><button data-action="feed">喂食</button><button data-action="play">玩耍</button><button data-action="sleep">休息</button><button data-action="follow" aria-pressed="false">跟随</button><button data-action="quit" aria-label="退出小狗">×</button></nav>
    <small id="hint">划过头部摸摸 · 跟随可开关 · 按住拖动</small>
  </main><script src="renderer.js"></script>
</body></html>
